[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "YKI-video-generator"
version = "0.1.0"
description = "Local Windows RTX 5090 short-video launcher"
requires-python = ">=3.12"
dependencies = ["Pillow==12.3.0", "sherpa-onnx==1.13.8", "py7zr==1.1.0"]

[tool.setuptools.packages.find]
include = ["app*"]
